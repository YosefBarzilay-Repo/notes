<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#830000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <title>משימות</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <button id="menuButton" class="icon-button app-logo-button" type="button" aria-label="פתיחת תפריט" title="תפריט" aria-expanded="false" aria-controls="sideMenu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h5" /></svg>
        </button>
        <div class="header-tools" aria-label="כלי רשימה">
          <label class="search-box" for="searchInput">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.4" /><path d="m16 16 4.2 4.2" /></svg>
            <input id="searchInput" type="search" placeholder="" aria-label="חיפוש" autocomplete="off" enterkeyhint="search" />
          </label>
          <label class="sort-control" for="sortSelect">
            <select id="sortSelect" aria-label="מיון">
              <option value="created">תאריך יצירה</option>
              <option value="due">תאריך יעד</option>
            </select>
          </label>
        </div>
      </header>

      <div id="menuBackdrop" class="menu-backdrop" hidden></div>
      <aside id="sideMenu" class="side-menu" aria-label="תפריט ניווט" aria-hidden="true">
        <div class="side-menu-header">
          <span>תפריט</span>
          <button id="closeMenuButton" class="close-button" type="button" aria-label="סגירת תפריט">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <nav class="side-menu-nav" aria-label="ניווט">
          <button class="menu-item" type="button" data-page="tasks">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h5" /></svg>
            <span>משימות</span>
          </button>
          <button class="menu-item" type="button" data-page="archive">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h16M6 7.5v11h12v-11M9 11h6M5 4h14v3.5H5z" /></svg>
            <span>ארכיון</span>
          </button>
          <button id="notificationsButton" class="menu-item" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17h12l-1.5-2v-4a4.5 4.5 0 0 0-9 0v4L6 17zM10 20h4" /></svg>
            <span>הפעלת התראות</span>
          </button>
        </nav>
      </aside>

      <section id="taskList" class="task-list" aria-live="polite"></section>

      <form id="taskForm" class="task-entry" autocomplete="off">
        <input id="taskTitleInput" type="text" maxlength="180" placeholder="" aria-label="משימה חדשה" />
        <button type="submit" class="submit-button" aria-label="הוספת משימה" title="הוספת משימה">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
        </button>
      </form>
    </main>

    <dialog id="editDialog" class="edit-dialog">
      <form id="editForm" method="dialog">
        <div class="dialog-header">
          <button id="closeDialogButton" class="close-button" type="button" aria-label="סגירה">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <input id="editTitleInput" type="text" maxlength="180" aria-label="כותרת המשימה" />
        <textarea id="editDetailsInput" rows="4" aria-label="פרטים או תיאור"></textarea>
        <input id="editDueDateInput" type="datetime-local" aria-label="תאריך ושעת יעד" />
        <div class="dialog-actions">
          <button class="save-button" type="submit" aria-label="שמירה" title="שמירה">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 4v6h8V4M8 16h8" /></svg>
          </button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
